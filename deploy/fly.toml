app = "readback-demo"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  RB_DATA = "/data"
  RB_GITHUB_WATCH = "1"
  RB_PUBLIC_URL = "https://readback-demo.fly.dev"
  # only accounts on the repository's list can approve with a GitHub sign-in; judges come in with the judge link
  RB_REVIEWERS = "ToukoUrsin"
  # an invited judge's approval is taken back after this many minutes, so the next judge finds the commit blocked
  RB_DEMO_MINUTES = "10"

[mounts]
  source = "readback_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
